name: Logistics MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  mlops-ci:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout mã nguồn
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Thiết lập môi trường Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    # 3. Cài đặt dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mlflow scikit-learn pandas numpy fastapi uvicorn pydantic
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Kiểm tra chất lượng code (Linting)
    - name: Lint code with flake8
      run: |
        flake8 app_eta.py train_eta.py --count --select=E9,F63,F7,F82 --show-source --statistics

    # 5. [MLOps Best Practice] Tự động chạy train trong CI để sinh ra Model Artifact (mlruns/) trước khi đóng gói
    - name: Run automated model training
      run: |
        python train_eta.py

    # 6. Build Docker Image (Lúc này thư mục mlruns/ đã được sinh ra tự động)
    - name: Build Docker image
      run: |
        docker build -t logistics-eta-api:${{ github.sha }} .

    # 7. Quét lỗ hổng bảo mật Container Image với Trivy
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'logistics-eta-api:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'